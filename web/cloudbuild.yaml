steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.prod'
      - '--build-arg'
      - 'VITE_API_URL=${_VITE_API_URL}'
      - '--build-arg'
      - 'VITE_GOOGLE_CLIENT_ID=${_VITE_GOOGLE_CLIENT_ID}'
      - '-t'
      - '${_IMAGE}'
      - '.'
substitutions:
  _VITE_API_URL: ''
  _VITE_GOOGLE_CLIENT_ID: ''
  _IMAGE: ''
images:
  - '${_IMAGE}'
