# Provider registry. Every entry is optional: if its env_key is absent the
# provider is skipped, so the app always runs with an empty .env (free tier only).
#
# tier: free  -> never costs money, no confirmation needed
#       paid  -> gated behind the CostGate modal + monthly budget

text:
  chain: [openrouter_free, gemini_free, openrouter_paid, anthropic]

  providers:
    openrouter_free:
      label: "OpenRouter (free pool)"
      kind: openai_compatible
      base_url: "https://openrouter.ai/api/v1"
      env_key: OPENROUTER_API_KEY
      tier: free
      cost_per_1k_in: 0.0
      cost_per_1k_out: 0.0
      models:
        - id: "nvidia/nemotron-3-super-120b-a12b:free"
          label: "Nemotron 3 Super 120B (free)"
          context: 32768
        - id: "nvidia/nemotron-3-ultra-550b-a55b:free"
          label: "Nemotron 3 Ultra 550B (free)"
          context: 32768
        - id: "nvidia/nemotron-3.5-lightning:free"
          label: "Nemotron 3.5 Lightning (free)"
          context: 32768
        - id: "inclusionai/ling-3.0-flash-sante:free"
          label: "Ling 3.0 Flash (free)"
          context: 16384
        - id: "liquid/lfm-2.5-2.6b:free"
          label: "LFM 2.5 (free)"
          context: 16384
        - id: "dots-studio/dots-3-note-preview:free"
          label: "Dots 3 (free)"
          context: 16384

    gemini_free:
      label: "Google Gemini"
      kind: gemini
      base_url: "https://generativelanguage.googleapis.com/v1beta"
      env_key: GEMINI_API_KEY
      tier: free
      cost_per_1k_in: 0.0
      cost_per_1k_out: 0.0
      models:
        - id: "gemini-flash-latest"
          label: "Gemini Flash"
          context: 1048576
        - id: "gemini-3.6-flash"
          label: "Gemini 3.6 Flash"
          context: 1048576
        - id: "gemini-3.8-flash"
          label: "Gemini 3.8 Flash"
          context: 1048576
        - id: "gemini-3.5-flash"
          label: "Gemini 3.5 Flash"
          context: 1048576
        - id: "gemini-pro-latest"
          label: "Gemini Pro"
          context: 1048576

    openrouter_paid:
      label: "OpenRouter"
      kind: openai_compatible
      base_url: "https://openrouter.ai/api/v1"
      env_key: OPENROUTER_API_KEY
      tier: paid
      cost_per_1k_in: 0.0002
      cost_per_1k_out: 0.0008
      models:
        - id: "google/gemini-2.0-flash-001"
          label: "Gemini 2.0 Flash"
          context: 1048576
        - id: "meta-llama/llama-3.3-70b-instruct"
          label: "Llama 3.3 70B"
          context: 65536
        - id: "anthropic/claude-3.5-haiku"
          label: "Claude 3.5 Haiku"
          context: 200000
        - id: "openai/gpt-4o-mini"
          label: "GPT-4o mini"
          context: 128000

    anthropic:
      label: "Anthropic Claude"
      kind: anthropic
      base_url: "https://api.anthropic.com/v1"
      env_key: ANTHROPIC_API_KEY
      tier: paid
      cost_per_1k_in: 0.0008
      cost_per_1k_out: 0.004
      models:
        - id: "claude-3-5-haiku-20241022"
          label: "Claude 3.5 Haiku"
          context: 200000
        - id: "claude-3-5-sonnet-20241022"
          label: "Claude 3.5 Sonnet"
          context: 200000

image:
  chain: [fal_cheap]

  providers:
    fal_cheap:
      label: "fal.ai (low cost)"
      kind: fal
      base_url: "https://fal.run"
      env_key: FAL_KEY
      tier: paid
      models:
        - id: "fal-ai/fast-sdxl"
          label: "Fast SDXL"
          cost_per_call: 0.0025
        - id: "fal-ai/flux/schnell"
          label: "FLUX schnell"
          cost_per_call: 0.003

    replicate:
      label: "Replicate"
      kind: replicate
      base_url: "https://api.replicate.com/v1"
      env_key: REPLICATE_API_TOKEN
      tier: paid
      models:
        - id: "black-forest-labs/flux-schnell"
          label: "FLUX schnell"
          cost_per_call: 0.003

audio:
  chain: [edge_tts]

  providers:
    edge_tts:
      label: "Edge TTS (free)"
      kind: edge_tts
      env_key: null
      tier: free
      models:
        - id: "en-AU-NatashaNeural"
          label: "Natasha (AU)"
          cost_per_call: 0.0
        - id: "en-GB-RyanNeural"
          label: "Ryan (UK)"
          cost_per_call: 0.0
